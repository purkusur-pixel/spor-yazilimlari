<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <title>Video Oynatıcı</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
        :root {
            --wrap-w: 90%;
            --wrap-max: 960px;
        }

        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #eee;
            font-family: sans-serif;
            min-height: 100vh;
            display: grid;
            place-items: start center;
        }

        #playerWrap {
            position: relative;
            width: var(--wrap-w);
            max-width: var(--wrap-max);
            margin: 20px auto;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }

        #videoPlayer {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            z-index: 1;
        }

        #ballOverlay {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        #frameCounter {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            font: 13px/1.2 monospace;
            z-index: 3;
            user-select: none;
        }

        .overlay-controls {
            position: absolute;
            left: 50%;
            bottom: 12px;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            background: rgba(0,0,0,0.55);
            padding: 8px 10px;
            border-radius: 10px;
            z-index: 3;
        }

            .overlay-controls button {
                padding: 8px 12px;
                font-size: 14px;
                border: none;
                border-radius: 8px;
                cursor: pointer;
                background: #0d6efd;
                color: #fff;
            }

        .frameBtn {
            background: #dc3545 !important;
        }

        .overlay-controls button:hover {
            filter: brightness(0.85);
        }
    </style>
</head>

<body>
    <div id="playerWrap">
        <video id="videoPlayer" controls>
            <source id="videoSource" type="video/mp4" />
            Tarayıcınız video etiketini desteklemiyor.
        </video>

        <canvas id="ballOverlay"></canvas>

        <div id="frameCounter">FPS: ? | Render: 0 | Kare: 0</div>

        <div class="overlay-controls">
            <button id="btnBackFrame" class="frameBtn">⏪ 1 Frame</button>
            <button id="btnBack10">⏮️ 10 Sn</button>
            <button id="btnFwdFrame" class="frameBtn">⏩ 1 Frame</button>
            <button id="btnFwd10">⏭️ 10 Sn</button>
            <button id="btnFullscreen">⛶ Tam Ekran</button>
        </div>
    </div>

    <script>
        /* ================== ELEMENTLER ================== */
        const wrap = document.getElementById('playerWrap');
        const video = document.getElementById('videoPlayer');
        const frameCounter = document.getElementById('frameCounter');
        const canvas = document.getElementById('ballOverlay');
        const ctx = canvas.getContext('2d');

        /* ================== BALL MAP ================== */
        /* frameIndex -> [x1,y1,x2,y2] (video piksel koordinatı) */
        let ballMap = Object.create(null);

        /* ================== FRAME / FPS ================== */
        let renderedCount = 0;
        let currentFrameIndex = 0;
        let fpsAuto = 0;

        let lastMediaTime = null;
        let winFrames = 0;
        let winTime = 0;

        const MIN_SAMPLE_SEC = 0.35;
        const MAX_SAMPLE_SEC = 2.0;

        let rafRunning = false;          // requestVideoFrameCallback zinciri tek olsun
        let lastSentFrame = -1;
        let lastSentAt = 0;
        const SEND_MS = 50;              // C# mesaj throttle (50ms)

        /* ================== CANVAS FIT (DPR + contain mapping) ================== */
        function fitCanvas() {
            const r = video.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;

            // Canvas'ı CSS px + DPR ile net yap
            const w = Math.max(1, Math.round(r.width * dpr));
            const h = Math.max(1, Math.round(r.height * dpr));

            if (canvas.width !== w || canvas.height !== h) {
                canvas.width = w;
                canvas.height = h;
            }

            // çizimlerimizi CSS px üstünden yapacağız:
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function clearBall() {
            const r = video.getBoundingClientRect();
            ctx.clearRect(0, 0, r.width, r.height); // CSS px alanı temizle
        }

        /**
         * object-fit: contain için video piksel -> canvas(CSS px) dönüşümü
         * Video görüntüsü, wrap içinde letterbox/pillarbox ile merkezlenir.
         */
        function getContainTransform() {
            const r = video.getBoundingClientRect();
            const cw = r.width;
            const ch = r.height;

            const vw = video.videoWidth || 1;
            const vh = video.videoHeight || 1;

            const scale = Math.min(cw / vw, ch / vh);
            const dispW = vw * scale;
            const dispH = vh * scale;
            const offX = (cw - dispW) / 2;
            const offY = (ch - dispH) / 2;

            return { cw, ch, vw, vh, scale, offX, offY, dispW, dispH };
        }

        function drawBallBox(frameIdx) {
            // key bazen string olabilir
            const key = String(frameIdx);
            const box = ballMap[frameIdx] || ballMap[key];

            if (!box || box.length < 4) {
                clearBall();
                return;
            }

            const { scale, offX, offY } = getContainTransform();

            // video piksel -> ekrandaki (CSS px) koordinat
            const x1 = offX + box[0] * scale;
            const y1 = offY + box[1] * scale;
            const x2 = offX + box[2] * scale;
            const y2 = offY + box[3] * scale;

            clearBall();
            ctx.lineWidth = 3;
            ctx.strokeStyle = "lime";
            ctx.strokeRect(x1, y1, (x2 - x1), (y2 - y1));
        }

        /* ================== FRAME LOOP ================== */
        function onFrame(now, metadata) {
            if (!rafRunning) return;

            renderedCount++;

            const mt = (metadata && typeof metadata.mediaTime === 'number')
                ? metadata.mediaTime
                : video.currentTime;

            if (lastMediaTime !== null) {
                const dt = mt - lastMediaTime;
                if (dt > 0 && dt < 1.0) {
                    winFrames++;
                    winTime += dt;

                    if (winTime >= MIN_SAMPLE_SEC) {
                        fpsAuto = winFrames / winTime;
                        if (winTime >= MAX_SAMPLE_SEC) {
                            winFrames = 0;
                            winTime = 0;
                        }
                    }
                }
            }
            lastMediaTime = mt;

            const fps = (fpsAuto > 0 ? fpsAuto : 25);
            currentFrameIndex = Math.max(0, Math.floor(video.currentTime * fps + 0.5));

            frameCounter.textContent =
                `FPS: ${fpsAuto > 0 ? fpsAuto.toFixed(2) : "?"} | Render: ${renderedCount} | Kare: ${currentFrameIndex}`;

            drawBallBox(currentFrameIndex);

            // C#'a frame gönder (throttle + değişince)
            const t = performance.now();
            if (currentFrameIndex !== lastSentFrame && (t - lastSentAt) >= SEND_MS) {
                lastSentFrame = currentFrameIndex;
                lastSentAt = t;
                try {
                    window.chrome?.webview?.postMessage(JSON.stringify({
                        type: "frameCount",
                        value: currentFrameIndex
                    }));
                } catch { }
            }

            video.requestVideoFrameCallback(onFrame);
        }

        /* ================== KONTROLLER ================== */
        function getFps() { return (fpsAuto > 0 ? fpsAuto : 25); }

        function jumpFrames(delta) {
            const fps = getFps();
            video.currentTime = Math.max(0, video.currentTime + (delta / fps));
        }

        function jumpSeconds(delta) {
            video.currentTime = Math.max(0, video.currentTime + delta);
        }

        document.getElementById('btnBackFrame').onclick = () => jumpFrames(-1);
        document.getElementById('btnFwdFrame').onclick = () => jumpFrames(1);
        document.getElementById('btnBack10').onclick = () => jumpSeconds(-10);
        document.getElementById('btnFwd10').onclick = () => jumpSeconds(10);

        document.getElementById('btnFullscreen').onclick = async () => {
            try {
                if (!document.fullscreenElement) await wrap.requestFullscreen();
                else await document.exitFullscreen();
            } catch { }
        };

        /* ================== WEBVIEW2 KOMUTLARI ================== */
        window.chrome?.webview?.addEventListener('message', ev => {
            const cmd = ev.data;
            if (!cmd) return;

            if (cmd.type === "play") {
                document.getElementById('videoSource').src = cmd.path;
                video.load();
                // play() bazı durumlarda kullanıcı etkileşimi ister, yine de dene
                video.play().catch(() => { });
            }

            if (cmd.type === "pause") {
                video.pause();
            }

            if (cmd.type === "seek") {
                const t = Number(cmd.time);
                if (!Number.isNaN(t)) video.currentTime = Math.max(0, t);
            }

            if (cmd.type === "setBallMap") {
                ballMap = cmd.map || Object.create(null);
                drawBallBox(currentFrameIndex);
            }
        });

        /* ================== VIDEO EVENTS ================== */
        video.addEventListener('loadedmetadata', () => {
            renderedCount = 0;
            fpsAuto = 0;
            lastMediaTime = null;
            winFrames = 0;
            winTime = 0;
            fitCanvas();
        });

        video.addEventListener('play', () => {
            if (!rafRunning) {
                rafRunning = true;
                video.requestVideoFrameCallback(onFrame);
            }
            try { window.chrome?.webview?.postMessage("playing"); } catch { }
        });

        video.addEventListener('pause', () => {
            try { window.chrome?.webview?.postMessage("paused"); } catch { }
        });

        video.addEventListener('ended', () => {
            rafRunning = false;
            try {
                window.chrome?.webview?.postMessage(JSON.stringify({
                    type: "ended",
                    frames: currentFrameIndex
                }));
            } catch { }
        });

        window.addEventListener('resize', fitCanvas);
        setInterval(fitCanvas, 400);
    </script>
</body>
</html>
