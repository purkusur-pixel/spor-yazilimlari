<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>WebView2 Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container d-flex flex-column justify-content-center align-items-center vh-100">
        <div class="text-center">
            <h1 class="mb-4 text-primary">WebView2 Sayfası</h1>

            <button class="btn btn-success btn-lg mb-3"
                    onclick="window.chrome.webview.postMessage('bildirim')">
                ✅ Bildirim Gönder
            </button>

            <br>

            <button class="btn btn-warning btn-lg"
                    onclick="window.chrome.webview.postMessage('bildirim2')">
                ⚠️ Diğer Bildirimi Gönder
            </button>
        </div>
    </div>

    <!-- Bootstrap JS (Gerekirse) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
